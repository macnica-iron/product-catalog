<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macnica - 產品目錄與產品線總覽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Color System (RGB 116, 29, 128) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcf5fd',
              100: '#f8eafd',
              200: '#f0d3fa',
              500: '#741D80', // 主色系 RGB(116,29,128)
              600: '#61166c',
              700: '#50105a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .brand-gradient {
      background: linear-gradient(135deg, #741D80 0%, #4A1053 100%);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans relative">

  <!-- 全頁 Loading 遮罩動畫 -->
  <div id="globalLoading" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
      <i data-lucide="database" class="w-6 h-6 text-brand-500 absolute"></i>
    </div>
    <div class="text-center space-y-1">
      <p class="text-base font-bold text-gray-800">資料同步中，請稍候...</p>
      <p class="text-xs text-gray-500">正在從 Google Sheets 取得最新的產品目錄</p>
    </div>
  </div>

  <!-- Header 頂部導覽列 -->
  <header class="brand-gradient text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row justify-between items-center gap-3">
      
      <!-- 公司 Logo 與換行副標題 -->
      <div class="flex flex-col items-center md:items-start gap-1">
        <img 
          src="https://www.macnica.com/content/experience-fragments/macnicagwi/apac/galaxy/zh_tw/site/header/master/_jcr_content/root/image.coreimg.svg/1723113588126/macnica-new-logo.svg" 
          alt="Macnica Logo" 
          class="h-6 sm:h-7 object-contain [filter:brightness(0)_invert(1)]"
        >
        <h1 class="text-xs sm:text-sm font-medium tracking-wider text-brand-100 opacity-90">
          產品目錄與產品線總覽
        </h1>
      </div>

      <!-- 🌟 右側功能區：最後更新時間、重新整理按鈕、產品線數量 -->
      <div class="flex flex-wrap items-center justify-center md:justify-end gap-2.5">
        
        <!-- Google Sheet 最後更新時間 -->
        <div class="text-[11px] text-brand-100 flex items-center gap-1 bg-black/15 px-2.5 py-1.5 rounded-lg backdrop-blur-sm border border-white/10">
          <span class="opacity-75">最後更新:</span>
          <span id="lastUpdatedDisplay" class="font-semibold text-white tracking-wide">--</span>
        </div>

        <!-- 重新整理按鈕 -->
        <button 
          id="refreshBtn"
          onclick="refreshData()" 
          title="清除快取並重新抓取最新資料"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-white/15 hover:bg-white/25 active:scale-95 text-white border border-white/20 transition-all shadow-sm backdrop-blur-sm"
        >
          <i data-lucide="rotate-cw" id="refreshIcon" class="w-3.5 h-3.5"></i>
          <span>重新整理</span>
        </button>

        <!-- 產品線數量 -->
        <div id="statsBadge" class="flex items-center text-xs bg-white/10 px-3 py-1.5 rounded-full backdrop-blur-sm border border-white/15">
          <span>產品線: <strong id="productLineCount" class="text-yellow-300 font-bold ml-1 text-sm">0</strong></span>
        </div>

      </div>

    </div>
  </header>

  <!-- Main Content 主體內容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">

    <!-- 搜尋欄與切換控制區域 -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-3 items-center justify-between">
      
      <!-- 搜尋輸入框 -->
      <div class="relative w-full md:flex-1">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          type="text" 
          id="searchInput"
          placeholder="搜尋產品線、原廠、主要產品、區域或關鍵字..." 
          disabled
          class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm text-sm disabled:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-400"
          oninput="handleSearch()"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
          <i data-lucide="x-circle" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 電商顯示格式切換器 -->
      <div class="flex items-center justify-between w-full md:w-auto gap-3 pt-1 md:pt-0 border-t md:border-t-0 border-gray-100">
        <span class="text-xs text-gray-400 font-medium whitespace-nowrap">顯示模式:</span>
        <div class="inline-flex bg-gray-100 p-1 rounded-xl border border-gray-200/80 gap-1">
          
          <button 
            id="view-btn-large" 
            onclick="changeViewMode('large')" 
            title="大圖像卡片"
            class="view-switch-btn p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-gray-500 hover:text-gray-900"
          >
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span class="hidden sm:inline">大圖像</span>
          </button>

          <button 
            id="view-btn-compact" 
            onclick="changeViewMode('compact')" 
            title="小圖像櫥窗"
            class="view-switch-btn p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-gray-500 hover:text-gray-900"
          >
            <i data-lucide="grid" class="w-4 h-4"></i>
            <span class="hidden sm:inline">小圖像</span>
          </button>

          <button 
            id="view-btn-list" 
            onclick="changeViewMode('list')" 
            title="列表式條列"
            class="view-switch-btn p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-brand-500 text-white shadow-sm"
          >
            <i data-lucide="list" class="w-4 h-4"></i>
            <span class="hidden sm:inline">列表式</span>
          </button>

        </div>
      </div>
    </section>

    <!-- 查無資料提示 -->
    <div id="noDataState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
      <i data-lucide="package-x" class="w-12 h-12 text-gray-300 mx-auto"></i>
      <h3 class="text-lg font-bold text-gray-700">找不到符合條件的產品線</h3>
      <p class="text-sm text-gray-500">請嘗試更換關鍵字重新搜尋</p>
      <button onclick="clearSearch()" class="mt-2 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-600 transition-colors">
        清除搜尋條件
      </button>
    </div>

    <!-- 動態顯示容器 -->
    <section id="displayContainer">
      <!-- 內容動態注入 -->
    </section>
  </main>

  <!-- 彈出詳細卡片 Modal -->
  <div 
    id="productModal" 
    onclick="handleModalBackdropClick(event)"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-all duration-200"
  >
    <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl p-6 sm:p-7 border border-gray-100 max-h-[90vh] overflow-y-auto transform transition-all duration-200 animate-in fade-in zoom-in-95">
      
      <!-- 關閉按鈕 -->
      <button 
        onclick="closeProductModal()" 
        class="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors"
        title="關閉卡片"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- 彈窗內容動態注入區 -->
      <div id="modalCardBody"></div>

    </div>
  </div>

  <!-- Footer 頁尾 -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 space-y-1">
      <p>Macnica 產品線視覺化查詢系統 &copy; Powered by Google Apps Script & GitHub Pages</p>
      <p class="text-gray-400">資料來源：Google Sheets 自動實時同步</p>
    </div>
  </footer>

  <script>
    let rawData = [];
    let headers = [];
    let productLineKey = '';
    let mainProductKey = '';
    let currentFilteredData = [];
    
    let currentViewMode = localStorage.getItem('macnica_view_mode') || 'list';

    // 國家國旗對應表
    const COUNTRY_FLAGS = [
      { name: '美國', flag: '🇺🇸' },
      { name: '日本', flag: '🇯🇵' },
      { name: '台灣', flag: '🇹🇼' },
      { name: '臺灣', flag: '🇹🇼' },
      { name: '以色列', flag: '🇮🇱' },
      { name: '中國大陸', flag: '🇨🇳' },
      { name: '中國', flag: '🇨🇳' },
      { name: '南韓', flag: '🇰🇷' },
      { name: '韓國', flag: '🇰🇷' },
      { name: '德國', flag: '🇩🇪' },
      { name: '英國', flag: '🇬🇧' },
      { name: '法國', flag: '🇫🇷' },
      { name: '新加坡', flag: '🇸🇬' },
      { name: '荷蘭', flag: '🇳🇱' },
      { name: '瑞士', flag: '🇨🇭' },
      { name: '加拿大', flag: '🇨🇦' },
      { name: '瑞典', flag: '🇸🇪' },
      { name: '義大利', flag: '🇮🇹' },
      { name: '西班牙', flag: '🇪🇸' },
      { name: '澳洲', flag: '🇦🇺' }
    ];

    // 🌟 國旗前置轉換函數：挪到名稱前面並加入一個半形空格（如 "🇯🇵 日本"）
    function addCountryFlags(str) {
      if (!str) return '';
      let result = String(str);
      COUNTRY_FLAGS.forEach(({ name, flag }) => {
        // 先移除可能重複存在的國旗
        result = result.replace(new RegExp(`${flag}\\s*`, 'g'), '');
        // 替換為：國旗 + 半形空格 + 國家名稱
        result = result.replace(new RegExp(`(${name})`, 'g'), `${flag} $1`);
      });
      return result;
    }

    window.onload = function() {
      lucide.createIcons();
      updateSwitcherButtons();
      fetchSheetData();

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeProductModal();
      });
    };

    // ⚠️ 務必替換為新 Google Sheet 部署出來的 Web App URL（結尾須為 /exec）
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwfn_bO64Jso9QkpmSRWfXTvEIIh8Q4Ovy0uhqycJRhV1j5Dt-9jJWpjqTvi-lFTB4o/exec";

    function fetchSheetData() {
      const localCache = localStorage.getItem('macnica_product_line_local');
      if (localCache) {
        try {
          const parsedData = JSON.parse(localCache);
          onDataLoaded(parsedData, true);
        } catch(e) {}
      } else {
        setSearchDisabled(true);
      }

      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error('網路連線失敗');
          return response.json();
        })
        .then(data => {
          if (!data.error) {
            localStorage.setItem('macnica_product_line_local', JSON.stringify(data));
          }
          onDataLoaded(data, false);
        })
        .catch(err => {
          console.error(err);
          if (!localCache) onDataError(err);
        });
    }

    // 🌟 重新整理功能：清除快取 + 穿透 Apps Script 後端快取
    function refreshData() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      // 1. 清除本地快取
      localStorage.removeItem('macnica_product_line_local');

      // 2. 顯示全螢幕 Loading
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) {
        loadingOverlay.classList.remove('hidden');
        loadingOverlay.classList.remove('opacity-0');
      }
      setSearchDisabled(true);

      // 3. 帶上 refresh 參數破除後端快取
      const refreshUrl = `${GAS_API_URL}?refresh=${Date.now()}`;

      fetch(refreshUrl)
        .then(response => {
          if (!response.ok) throw new Error('網路連線失敗');
          return response.json();
        })
        .then(data => {
          if (!data.error) {
            localStorage.setItem('macnica_product_line_local', JSON.stringify(data));
          }
          onDataLoaded(data, false);
        })
        .catch(err => {
          console.error(err);
          onDataError(err);
        })
        .finally(() => {
          if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        });
    }

    function onDataLoaded(response, isFromCache) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) {
        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }

      if (response.error) {
        if (!isFromCache) alert('資料讀取失敗：' + response.error);
        return;
      }

      headers = response.headers || [];
      rawData = response.rows || [];

      // 更新最後更新日期
      const lastUpdated = response.lastUpdated || localStorage.getItem('macnica_last_updated') || '已同步';
      if (response.lastUpdated) {
        localStorage.setItem('macnica_last_updated', response.lastUpdated);
      }
      const lastUpdateElem = document.getElementById('lastUpdatedDisplay');
      if (lastUpdateElem) lastUpdateElem.innerText = lastUpdated;

      if (!rawData || rawData.length === 0) {
        document.getElementById('noDataState').classList.remove('hidden');
        return;
      }

      detectKeyColumns();
      renderCurrentView();
      setSearchDisabled(false);
      updateStats();
    }

    function onDataError(err) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      alert('無法連線至 Google Sheets API，請檢查 Apps Script 發布權限是否設為「所有人」。');
    }

    function setSearchDisabled(disabled) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.disabled = disabled;
    }

    function detectKeyColumns() {
      productLineKey = headers.find(h => h.includes('產品線') || h.includes('類別') || h.toLowerCase().includes('category')) || headers[0];
      mainProductKey = headers.find(h => h.includes('產品') || h.includes('品名') || h.includes('品牌') || h.toLowerCase().includes('product')) || headers[0];
    }

    function extractImageUrl(str) {
      if (!str) return null;
      str = String(str).trim();
      const match = str.match(/https?:\/\/[^\s"',\)]+/i);
      return match ? match[0] : null;
    }

    function changeViewMode(mode) {
      if (currentViewMode === mode) return;
      currentViewMode = mode;
      localStorage.setItem('macnica_view_mode', mode);
      updateSwitcherButtons();
      renderCurrentView();
    }

    function updateSwitcherButtons() {
      const modes = ['large', 'compact', 'list'];
      modes.forEach(m => {
        const btn = document.getElementById(`view-btn-${m}`);
        if (!btn) return;
        if (m === currentViewMode) {
          btn.className = "view-switch-btn p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all bg-brand-500 text-white shadow-sm";
        } else {
          btn.className = "view-switch-btn p-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-gray-500 hover:text-gray-900";
        }
      });
    }

    function renderCurrentView() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('displayContainer');
      const noData = document.getElementById('noDataState');

      currentFilteredData = rawData.filter(item => {
        return !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
      });

      if (currentFilteredData.length === 0) {
        container.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }
      noData.classList.add('hidden');

      if (currentViewMode === 'large') {
        renderLargeGrid(currentFilteredData, container);
      } else if (currentViewMode === 'compact') {
        renderCompactGrid(currentFilteredData, container);
      } else {
        renderListView(currentFilteredData, container);
      }

      lucide.createIcons();
    }

    // 建立大卡片內容 HTML 模板（官網另開新視窗 + 國旗在前）
    function buildCardHtml(item) {
      const titleName = item[mainProductKey] || item[productLineKey] || '未命名項目';

      let logoUrl = null;
      const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
      if (logoKey && item[logoKey]) logoUrl = extractImageUrl(item[logoKey]);

      const mainProductDescKey = Object.keys(item).find(k => k.includes('主要產品') || k.includes('描述') || k.includes('簡介'));
      const mainProductDesc = mainProductDescKey ? item[mainProductDescKey] : '';

      const detailsList = [{ key: '產品線 / 原廠', val: titleName }];
      Object.keys(item).forEach(k => {
        const isLogo = logoKey ? (k === logoKey) : k.toLowerCase().includes('logo');
        const isMainDesc = mainProductDescKey ? (k === mainProductDescKey) : k.includes('主要產品');
        const isTitle = (k === mainProductKey);
        if (!isLogo && !isMainDesc && !isTitle && item[k]) {
          let val = item[k];
          if (k.includes('所在地') || k.includes('區域') || k.toLowerCase().includes('location') || k.toLowerCase().includes('region')) {
            val = addCountryFlags(val);
          }
          detailsList.push({ key: k, val: val });
        }
      });

      const detailsHtml = detailsList.map(d => {
        let displayVal = d.val;
        
        // 官網欄位點擊另開新分頁
        if (d.key.includes('官網') || (typeof d.val === 'string' && (d.val.startsWith('http://') || d.val.startsWith('https://')))) {
          const url = d.val.startsWith('http') ? d.val : `https://${d.val}`;
          displayVal = `
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="text-brand-500 hover:text-brand-700 hover:underline inline-flex items-center gap-1 font-semibold break-all">
              ${d.val} <i data-lucide="external-link" class="w-3 h-3 shrink-0 inline"></i>
            </a>
          `;
        }

        return `
          <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-100 last:border-0">
            <span class="text-gray-400 font-medium shrink-0 mr-2">${d.key}</span>
            <span class="text-gray-700 font-semibold text-right break-all">${displayVal}</span>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4">
          ${logoUrl ? `
            <div class="w-full h-20 flex items-center justify-center p-2 rounded-xl bg-gray-50/50">
              <img src="${logoUrl}" alt="${titleName}" class="max-h-14 max-w-[80%] object-contain mx-auto transition-transform duration-200 group-hover:scale-105 [mix-blend-mode:multiply]" loading="lazy">
            </div>
          ` : '<div class="h-20 flex items-center justify-center text-gray-300 text-xs">無 Logo</div>'}
          
          <div class="bg-gray-50/70 p-3.5 rounded-xl space-y-0.5">
            ${detailsHtml}
          </div>

          ${mainProductDesc ? `
            <div class="bg-brand-50/60 p-4 rounded-xl border border-brand-100/60 text-center text-xs font-medium text-gray-700 leading-relaxed">
              ${mainProductDesc}
            </div>
          ` : ''}
        </div>
      `;
    }

    // 模式 1：大圖像模式
    function renderLargeGrid(data, container) {
      let html = '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">';
      html += data.map(item => `
        <article class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all flex flex-col justify-between space-y-4 group">
          ${buildCardHtml(item)}
        </article>
      `).join('');
      html += '</div>';
      container.innerHTML = html;
    }

    // 模式 2：小圖像模式（不顯示主要產品內容）
    function renderCompactGrid(data, container) {
      let html = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">';
      html += data.map((item, idx) => {
        const titleName = item[mainProductKey] || item[productLineKey] || '未命名項目';

        let logoUrl = null;
        const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
        if (logoKey && item[logoKey]) logoUrl = extractImageUrl(item[logoKey]);

        const locationKey = Object.keys(item).find(k => k.includes('所在地') || k.includes('區域') || k.toLowerCase().includes('location'));
        const locationVal = locationKey ? addCountryFlags(item[locationKey]) : '';

        return `
          <div 
            onclick="openProductModal(${idx})" 
            class="bg-white rounded-xl p-4 border border-gray-200/80 shadow-sm hover:shadow-md hover:border-brand-400 hover:ring-2 hover:ring-brand-100 transition-all flex flex-col justify-center items-center group cursor-pointer relative"
          >
            <div class="w-full space-y-2.5">
              <div class="w-full h-16 bg-gray-50/80 rounded-lg p-1.5 flex items-center justify-center border border-gray-100 group-hover:bg-brand-50/30 transition-colors">
                ${logoUrl ? `
                  <img src="${logoUrl}" alt="${titleName}" class="max-h-11 max-w-[85%] object-contain [mix-blend-mode:multiply]" loading="lazy">
                ` : `<span class="text-[10px] text-gray-400">Logo</span>`}
              </div>
              <div class="text-center space-y-1">
                <h4 class="text-xs font-bold text-gray-800 tracking-tight truncate group-hover:text-brand-600 transition-colors">
                  ${titleName}
                </h4>
                ${locationVal ? `
                  <span class="inline-block text-[10px] font-medium text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full border border-brand-100/60">
                    ${locationVal}
                  </span>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
      html += '</div>';
      container.innerHTML = html;
    }

    // 模式 3：列表式模式（手機居中、粉色主要產品框支援 4 行）
    function renderListView(data, container) {
      let html = '<div class="space-y-2">';
      html += data.map((item, idx) => {
        const titleName = item[mainProductKey] || item[productLineKey] || '未命名項目';

        let logoUrl = null;
        const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
        if (logoKey && item[logoKey]) logoUrl = extractImageUrl(item[logoKey]);

        const locationKey = Object.keys(item).find(k => k.includes('所在地') || k.includes('區域') || k.toLowerCase().includes('location') || k.toLowerCase().includes('region'));
        const locationVal = locationKey ? addCountryFlags(item[locationKey]) : '';

        const mainProductDescKey = Object.keys(item).find(k => k.includes('主要產品') || k.includes('描述') || k.includes('簡介'));
        const mainProductDesc = mainProductDescKey ? item[mainProductDescKey] : '';

        return `
          <div 
            onclick="openProductModal(${idx})" 
            class="product-bar-item bg-white rounded-xl border border-gray-200/80 shadow-sm hover:border-brand-400 hover:ring-2 hover:ring-brand-100 transition-all overflow-hidden cursor-pointer"
          >
            <div class="px-3.5 py-3 md:py-0 md:h-28 flex items-center justify-between gap-3 md:gap-5 select-none hover:bg-brand-50/15 transition-colors">
              
              <!-- 🌟 小畫面專屬排版 (md:hidden)：Logo(左) + 原廠名稱(正中間) + 產地(右) -->
              <div class="flex md:hidden items-center justify-between w-full gap-2">
                <!-- 左：Logo -->
                <div class="w-16 h-9 shrink-0 bg-gray-50 border border-gray-100 rounded-lg p-1 flex items-center justify-center">
                  ${logoUrl ? `
                    <img src="${logoUrl}" alt="${titleName}" class="max-h-7 max-w-[90%] object-contain [mix-blend-mode:multiply]" loading="lazy">
                  ` : `<span class="text-[9px] text-gray-400">Logo</span>`}
                </div>

                <!-- 中：產品線 / 原廠名稱 (置中) -->
                <div class="flex-1 text-center px-1 min-w-0">
                  <h3 class="text-xs sm:text-sm font-bold text-gray-800 tracking-tight truncate" title="${titleName}">
                    ${titleName}
                  </h3>
                </div>

                <!-- 右：產地標籤 (含國旗在前) -->
                <div class="shrink-0 flex justify-end">
                  ${locationVal ? `
                    <span class="inline-flex items-center text-[10px] font-medium text-brand-600 bg-brand-50 border border-brand-100 px-2 py-0.5 rounded-full whitespace-nowrap">
                      ${locationVal}
                    </span>
                  ` : '<span class="w-2"></span>'}
                </div>
              </div>

              <!-- 🌟 大畫面排版 (hidden md:flex)：Logo + 名稱&產地 + 粉色 4 行主要產品框 -->
              <div class="hidden md:flex items-center justify-between w-full h-full gap-5">
                
                <!-- 1. Logo -->
                <div class="w-24 h-11 shrink-0 bg-gray-50 border border-gray-100 rounded-lg p-1 flex items-center justify-center">
                  ${logoUrl ? `
                    <img src="${logoUrl}" alt="${titleName}" class="max-h-8 max-w-[90%] object-contain [mix-blend-mode:multiply]" loading="lazy">
                  ` : `<span class="text-[10px] text-gray-400">無 Logo</span>`}
                </div>

                <!-- 2. 產品線名稱 + 所在地標籤 -->
                <div class="flex flex-col gap-1.5 shrink-0 w-48 lg:w-56 min-w-0">
                  <h3 class="text-sm font-bold text-gray-800 tracking-tight truncate" title="${titleName}">
                    ${titleName}
                  </h3>
                  ${locationVal ? `
                    <span class="inline-flex items-center text-[10px] font-medium text-brand-600 bg-brand-50 border border-brand-100 px-2 py-0.5 rounded-full shrink-0 w-fit">
                      ${locationVal}
                    </span>
                  ` : ''}
                </div>

                <!-- 3. 主要產品 (拿掉標籤，粉色框，支援 4 行) -->
                <div class="flex-1 flex items-center border-l border-gray-100 pl-4 min-w-0 h-full py-2">
                  <div class="w-full bg-brand-50/60 px-4 py-2.5 rounded-xl border border-brand-100/60 text-xs font-medium text-gray-700 leading-relaxed line-clamp-4 break-words">
                    ${mainProductDesc || '<span class="text-gray-300 italic">無詳細產品描述</span>'}
                  </div>
                </div>

              </div>

            </div>
          </div>
        `;
      }).join('');
      html += '</div>';
      container.innerHTML = html;
    }

    function openProductModal(idx) {
      const item = currentFilteredData[idx];
      if (!item) return;

      const modal = document.getElementById('productModal');
      const body = document.getElementById('modalCardBody');

      body.innerHTML = buildCardHtml(item);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.classList.add('overflow-hidden');

      lucide.createIcons();
    }

    function closeProductModal() {
      const modal = document.getElementById('productModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.classList.remove('overflow-hidden');
    }

    function handleModalBackdropClick(event) {
      if (event.target.id === 'productModal') {
        closeProductModal();
      }
    }

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (keyword) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCurrentView();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderCurrentView();
    }

    function updateStats() {
      const categories = new Set(rawData.map(item => item[productLineKey]).filter(Boolean));
      document.getElementById('productLineCount').innerText = categories.size;
    }
  </script>
</body>
</html>
