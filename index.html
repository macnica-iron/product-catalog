<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>產品線與主要產品目錄</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Color System (RGB 116, 29, 128) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcf5fd',
              100: '#f8eafd',
              200: '#f0d3fa',
              500: '#741D80', // 主色系 RGB(116,29,128)
              600: '#61166c',
              700: '#50105a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .brand-gradient {
      background: linear-gradient(135deg, #741D80 0%, #4A1053 100%);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

  <!-- Header 頂部導覽列 -->
  <header class="brand-gradient text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white/10 rounded-lg backdrop-blur-sm">
          <i data-lucide="layers" class="w-7 h-7 text-white"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">產品目錄與產品線總覽</h1>
          <p class="text-xs text-brand-100 opacity-90">Google Sheets 動態即時同步網站</p>
        </div>
      </div>
      <!-- 統計數據 -->
      <div id="statsBadge" class="hidden sm:flex items-center gap-4 text-xs bg-white/10 px-4 py-2 rounded-full backdrop-blur-sm">
        <span>產品線: <strong id="productLineCount" class="text-yellow-300 font-bold">0</strong></span>
        <span class="border-r border-white/20 h-3"></span>
        <span>總產品數: <strong id="totalProductCount" class="text-yellow-300 font-bold">0</strong></span>
      </div>
    </div>
  </header>

  <!-- Main Content 主體內容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- 搜尋與篩選區域 -->
    <section class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
        <!-- 搜尋欄 -->
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input 
            type="text" 
            id="searchInput"
            placeholder="搜尋主要產品名稱、規格或關鍵字..." 
            class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm"
            oninput="handleSearch()"
          >
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
            <i data-lucide="x-circle" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- 產品線分類 Tag 篩選區 -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="filter" class="w-3.5 h-3.5 text-brand-500"></i> 按產品線快速篩選
        </label>
        <div id="categoryTags" class="flex flex-wrap gap-2 pt-1">
          <button onclick="filterCategory('ALL')" class="category-btn active bg-brand-500 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm">
            全部產品線
          </button>
          <!-- 動態生成產品線按鈕 -->
        </div>
      </div>
    </section>

    <!-- 載入中狀態 (Loading Skeleton) -->
    <div id="loadingState" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 py-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 animate-pulse space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/3"></div>
        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
        <div class="h-20 bg-gray-100 rounded"></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 animate-pulse space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/3"></div>
        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
        <div class="h-20 bg-gray-100 rounded"></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 animate-pulse space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/3"></div>
        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
        <div class="h-20 bg-gray-100 rounded"></div>
      </div>
    </div>

    <!-- 查無資料提示 -->
    <div id="noDataState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
      <i data-lucide="package-x" class="w-12 h-12 text-gray-300 mx-auto"></i>
      <h3 class="text-lg font-bold text-gray-700">找不到符合條件的產品</h3>
      <p class="text-sm text-gray-500">請嘗試更換關鍵字或重設產品線篩選條件</p>
      <button onclick="resetAllFilters()" class="mt-2 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-600 transition-colors">
        重設篩選條件
      </button>
    </div>

    <!-- 產品列表卡片網格 (RWD: 手機 1 欄 / 平板 2 欄 / 桌機 3 欄) -->
    <section id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 產品卡片將由 JavaScript 動態渲染 -->
    </section>
  </main>

  <!-- Footer 頁尾 -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 space-y-1">
      <p>產品線視覺化查詢系統 &copy; Powered by Google Apps Script</p>
      <p class="text-gray-400">資料來源：Google Sheets 自動實時同步</p>
    </div>
  </footer>

  <script>
    let rawData = [];
    let headers = [];
    let selectedCategory = 'ALL';
    let productLineKey = '';
    let mainProductKey = '';

    // 初始化頁面
    window.onload = function() {
      lucide.createIcons();
      fetchSheetData();
    };

// 從 Google Apps Script API 取得 JSON 資料
    function fetchSheetData() {
      // 替換成你的 Apps Script Web App 網址
      const GAS_API_URL = "https://script.google.com/macros/s/你的部署ID/exec";

      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => onDataLoaded(data))
        .catch(err => onDataError(err));
    }


    function onDataLoaded(response) {
      document.getElementById('loadingState').classList.add('hidden');

      if (response.error) {
        alert('資料讀取失敗：' + response.error);
        return;
      }

      headers = response.headers;
      rawData = response.rows;

      if (!rawData || rawData.length === 0) {
        document.getElementById('noDataState').classList.remove('hidden');
        return;
      }

      // 自動辨識「產品線」與「主要產品」欄位名稱
      detectKeyColumns();
      
      // 渲染產品線篩選按鈕
      renderCategoryTags();
      
      // 渲染產品列表
      renderProducts();

      // 更新頁面統計
      updateStats();
    }

    function onDataError(err) {
      document.getElementById('loadingState').classList.add('hidden');
      alert('無法連線至 Google Sheets，請檢查後端發布設定。');
    }

    // 自動探測產品線與主要產品對應欄位
    function detectKeyColumns() {
      productLineKey = headers.find(h => h.includes('產品線') || h.includes('類別') || h.toLowerCase().includes('category')) || headers[0];
      mainProductKey = headers.find(h => h.includes('產品') || h.includes('品名') || h.toLowerCase().includes('product')) || headers[1] || headers[0];
    }

    // 生成「產品線」篩選 Tag
    function renderCategoryTags() {
      const categories = [...new Set(rawData.map(item => item[productLineKey]).filter(Boolean))];
      const container = document.getElementById('categoryTags');

      let html = `
        <button onclick="filterCategory('ALL')" class="category-btn active bg-brand-500 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm" data-cat="ALL">
          全部 (${rawData.length})
        </button>
      `;

      categories.forEach(cat => {
        const count = rawData.filter(i => i[productLineKey] === cat).length;
        html += `
          <button onclick="filterCategory('${cat}')" class="category-btn bg-gray-100 text-gray-700 hover:bg-brand-50 hover:text-brand-500 px-4 py-1.5 rounded-full text-sm font-medium transition-all" data-cat="${cat}">
            ${cat} (${count})
          </button>
        `;
      });

      container.innerHTML = html;
    }

    // 依條件過濾並呈現產品卡片
    function renderProducts() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('productGrid');
      const noData = document.getElementById('noDataState');

      const filtered = rawData.filter(item => {
        // 產品線篩選
        const matchCategory = selectedCategory === 'ALL' || item[productLineKey] === selectedCategory;
        
        // 關鍵字全欄位搜尋
        const matchSearch = !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));

        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }

      noData.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const categoryName = item[productLineKey] || '未分類';
        const productName = item[mainProductKey] || '未命名產品';

        // 剩餘欄位內容作為規格/說明展延
        const otherDetails = Object.keys(item)
          .filter(k => k !== productLineKey && k !== mainProductKey && item[k])
          .map(k => `
            <div class="flex justify-between items-start text-xs py-1 border-b border-gray-50 last:border-0">
              <span class="text-gray-400 font-medium">${k}</span>
              <span class="text-gray-700 font-semibold text-right">${item[k]}</span>
            </div>
          `).join('');

        return `
          <article class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all flex flex-col justify-between space-y-4 group">
            <div class="space-y-3">
              <!-- 產品線分類 Badge -->
              <div class="flex justify-between items-center">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-brand-50 text-brand-500 border border-brand-100">
                  ${categoryName}
                </span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-brand-500 group-hover:translate-x-1 transition-all"></i>
              </div>

              <!-- 主要產品標題 -->
              <h3 class="text-lg font-bold text-gray-800 group-hover:text-brand-500 transition-colors leading-snug">
                ${productName}
              </h3>

              <!-- 關鍵規格/詳細資訊列表 -->
              <div class="bg-gray-50/70 p-3 rounded-xl space-y-0.5">
                ${otherDetails || '<p class="text-xs text-gray-400">無其他詳細規格</p>'}
              </div>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 搜尋功能處理
    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (keyword) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderProducts();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderProducts();
    }

    // 類別切換
    function filterCategory(cat) {
      selectedCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "category-btn active bg-brand-500 text-white px-4 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm";
        } else {
          btn.className = "category-btn bg-gray-100 text-gray-700 hover:bg-brand-50 hover:text-brand-500 px-4 py-1.5 rounded-full text-sm font-medium transition-all";
        }
      });
      renderProducts();
    }

    function resetAllFilters() {
      clearSearch();
      filterCategory('ALL');
    }

    function updateStats() {
      const categories = new Set(rawData.map(item => item[productLineKey]).filter(Boolean));
      document.getElementById('productLineCount').innerText = categories.size;
      document.getElementById('totalProductCount').innerText = rawData.length;
    }
  </script>
</body>
</html>
