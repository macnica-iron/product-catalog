<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macnica - 產品目錄與展示總覽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Color System (RGB 116, 29, 128) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcf5fd',
              100: '#f8eafd',
              200: '#f0d3fa',
              500: '#741D80', // 主色系 RGB(116,29,128)
              600: '#61166c',
              700: '#50105a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .brand-gradient {
      background: linear-gradient(135deg, #741D80 0%, #4A1053 100%);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans relative">

  <!-- 全頁 Loading 遮罩動畫 -->
  <div id="globalLoading" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
      <i data-lucide="database" class="w-6 h-6 text-brand-500 absolute"></i>
    </div>
    <div class="text-center space-y-1">
      <p class="text-base font-bold text-gray-800">資料同步中，請稍候...</p>
      <p class="text-xs text-gray-500">正在從 Google Sheets 取得最新的資料庫內容</p>
    </div>
  </div>

  <!-- Header 頂部導覽列 -->
  <header class="brand-gradient text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-row justify-between items-center gap-4">
      
      <!-- 公司 Logo 與換行動態標題 -->
      <div class="flex flex-col items-start gap-1">
        <img 
          src="https://www.macnica.com/content/experience-fragments/macnicagwi/apac/galaxy/zh_tw/site/header/master/_jcr_content/root/image.coreimg.svg/1723113588126/macnica-new-logo.svg" 
          alt="Macnica Logo" 
          class="h-6 sm:h-7 object-contain [filter:brightness(0)_invert(1)]"
        >
        <h1 id="headerSubtitle" class="text-xs sm:text-sm font-medium tracking-wider text-brand-100 opacity-90">
          產品目錄與產品線總覽
        </h1>
      </div>

      <!-- 右上角動態統計數據 -->
      <div id="statsBadge" class="flex items-center text-xs bg-white/10 px-3.5 py-1.5 rounded-full backdrop-blur-sm">
        <span id="statLabel">產品線數量:</span>
        <strong id="productLineCount" class="text-yellow-300 font-bold ml-1 text-sm">0</strong>
      </div>

    </div>

    <!-- 🌟 主流切換分頁選單 (RWD + 滑動適應) -->
    <div class="bg-black/10 border-t border-white/10 backdrop-blur-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2">
        
        <button 
          id="tab-productLine" 
          onclick="switchTab('productLine')" 
          class="tab-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 whitespace-nowrap bg-white text-brand-700 shadow-sm"
        >
          <i data-lucide="package" class="w-4 h-4"></i>
          <span>產品目錄與產品線總覽</span>
        </button>

        <button 
          id="tab-demonstration" 
          onclick="switchTab('demonstration')" 
          class="tab-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 whitespace-nowrap text-brand-100 hover:bg-white/10 hover:text-white"
        >
          <i data-lucide="presentation" class="w-4 h-4"></i>
          <span>Ready to Demonstrations</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Content 主體內容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- 搜尋欄區域 -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          type="text" 
          id="searchInput"
          placeholder="搜尋關鍵字、規格或名稱..." 
          disabled
          class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm disabled:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-400"
          oninput="handleSearch()"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
          <i data-lucide="x-circle" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <!-- 查無資料提示 -->
    <div id="noDataState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
      <i data-lucide="package-x" class="w-12 h-12 text-gray-300 mx-auto"></i>
      <h3 class="text-lg font-bold text-gray-700">找不到符合條件的項目</h3>
      <p class="text-sm text-gray-500">請嘗試更換關鍵字重新搜尋</p>
      <button onclick="clearSearch()" class="mt-2 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-600 transition-colors">
        清除搜尋條件
      </button>
    </div>

    <!-- 列表卡片網格 (RWD: 手機 1 欄 / 平板 2 欄 / 桌機 3 欄) -->
    <section id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 內容將由 JavaScript 動態渲染 -->
    </section>
  </main>

  <!-- Footer 頁尾 -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 space-y-1">
      <p>Macnica 產品與展示視覺化查詢系統 &copy; Powered by Google Apps Script & GitHub Pages</p>
      <p class="text-gray-400">資料來源：Google Sheets 自動實時同步</p>
    </div>
  </footer>

  <script>
    let allData = {
      productLine: { headers: [], rows: [] },
      demonstration: { headers: [], rows: [] }
    };
    
    let activeTab = 'productLine'; // 當前頁籤: 'productLine' 或 'demonstration'

    window.onload = function() {
      lucide.createIcons();
      fetchSheetData();
    };

    function fetchSheetData() {
      // ⚠️ 務必替換為你真實的 Apps Script Web App 網址（結尾須為 /exec）
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxZj0MaQKmVItG0rtXQBtQeGjp8JmQ7_Vs8sBvNAfm36ra2i8ikcXoXMBA4xgrnpAQpEQ/exec";

      setSearchDisabled(true);

      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error('網路連線失敗');
          return response.json();
        })
        .then(data => onDataLoaded(data))
        .catch(err => {
          console.error(err);
          onDataError(err);
        });
    }

    function onDataLoaded(response) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) {
        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }

      if (response.error) {
        alert('資料讀取失敗：' + response.error);
        return;
      }

      // 支援多工作表 JSON 結構
      if (response.productLine) {
        allData.productLine = response.productLine;
        allData.demonstration = response.demonstration || { headers: [], rows: [] };
      } else {
        allData.productLine = { headers: response.headers || [], rows: response.rows || [] };
        allData.demonstration = { headers: [], rows: [] };
      }

      setSearchDisabled(false);
      renderCurrentTab();
    }

    function onDataError(err) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      alert('無法連線至 Google Sheets API，請檢查 Apps Script 發布權限是否設為「所有人」。');
    }

    function setSearchDisabled(disabled) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.disabled = disabled;
    }

    // 🌟 切換頁籤邏輯
    function switchTab(tabKey) {
      if (activeTab === tabKey) return;
      activeTab = tabKey;

      // 更新 Tab 標籤樣式
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 whitespace-nowrap text-brand-100 hover:bg-white/10 hover:text-white";
      });

      const activeBtn = document.getElementById(`tab-${tabKey}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 whitespace-nowrap bg-white text-brand-700 shadow-sm";
      }

      // 清除搜尋框並重新渲染
      clearSearch();
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (activeTab === 'productLine') {
        document.getElementById('headerSubtitle').innerText = "產品目錄與產品線總覽";
        document.getElementById('statLabel').innerText = "產品線數量:";
        renderProductLineTab();
      } else {
        document.getElementById('headerSubtitle').innerText = "Ready to Demonstrations";
        document.getElementById('statLabel').innerText = "展示項目數:";
        renderDemonstrationTab();
      }
    }

    // 從字串提取圖片 URL
    function extractImageUrl(str) {
      if (!str) return null;
      str = String(str).trim();
      const match = str.match(/https?:\/\/[^\s"',\)]+/i);
      return match ? match[0] : null;
    }

    // 🌟 頁籤 1: 產品目錄與產品線總覽 (完全保持原本設計)
    function renderProductLineTab() {
      const sheetData = allData.productLine;
      const headers = sheetData.headers || [];
      const rawData = sheetData.rows || [];

      const productLineKey = headers.find(h => h.includes('產品線') || h.includes('類別') || h.toLowerCase().includes('category')) || headers[0];
      const mainProductKey = headers.find(h => h.includes('產品') || h.includes('品名') || h.includes('品牌') || h.toLowerCase().includes('product')) || headers[0];

      // 更新右上角統計
      const categories = new Set(rawData.map(item => item[productLineKey]).filter(Boolean));
      document.getElementById('productLineCount').innerText = categories.size;

      // 搜尋過濾
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = rawData.filter(item => {
        return !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
      });

      const grid = document.getElementById('productGrid');
      const noData = document.getElementById('noDataState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }
      noData.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const titleName = item[mainProductKey] || item[productLineKey] || '未命名項目';

        // 1. 提取 Logo URL
        let logoUrl = null;
        const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
        if (logoKey && item[logoKey]) {
          logoUrl = extractImageUrl(item[logoKey]);
        }

        // 2. 提取主要產品內容
        const mainProductDescKey = Object.keys(item).find(k => k.includes('主要產品') || k.includes('描述') || k.includes('簡介'));
        const mainProductDesc = mainProductDescKey ? item[mainProductDescKey] : '';

        // 3. 組合中間規格列表（第一項固定為「產品線 / 原廠」）
        const detailsList = [{ key: '產品線 / 原廠', val: titleName }];
        Object.keys(item).forEach(k => {
          const isLogo = logoKey ? (k === logoKey) : k.toLowerCase().includes('logo');
          const isMainDesc = mainProductDescKey ? (k === mainProductDescKey) : k.includes('主要產品');
          const isTitle = (k === mainProductKey);
          if (!isLogo && !isMainDesc && !isTitle && item[k]) {
            detailsList.push({ key: k, val: item[k] });
          }
        });

        const detailsHtml = detailsList.map(d => `
          <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-100 last:border-0">
            <span class="text-gray-400 font-medium shrink-0 mr-2">${d.key}</span>
            <span class="text-gray-700 font-semibold text-right break-all">${d.val}</span>
          </div>
        `).join('');

        return `
          <article class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all flex flex-col justify-between space-y-4 group">
            <div class="space-y-4">
              ${logoUrl ? `
                <div class="flex justify-center items-center pt-2 pb-1 min-h-[70px]">
                  <img src="${logoUrl}" alt="${titleName} Logo" class="w-2/3 max-h-20 object-contain mx-auto" onerror="this.parentNode.style.display='none'">
                </div>
              ` : ''}
              <div class="bg-gray-50/70 p-3.5 rounded-xl space-y-0.5">
                ${detailsHtml}
              </div>
              ${mainProductDesc ? `
                <div class="bg-brand-50/60 p-4 rounded-xl border border-brand-100/60 text-center text-xs font-medium text-gray-700 leading-relaxed">
                  ${mainProductDesc}
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 🌟 頁籤 2: Ready to Demonstrations 動態渲染
    function renderDemonstrationTab() {
      const sheetData = allData.demonstration;
      const headers = sheetData.headers || [];
      const rawData = sheetData.rows || [];

      document.getElementById('productLineCount').innerText = rawData.length;

      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = rawData.filter(item => {
        return !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
      });

      const grid = document.getElementById('productGrid');
      const noData = document.getElementById('noDataState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }
      noData.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const keys = Object.keys(item);
        const titleKey = keys.find(k => k.includes('名稱') || k.includes('標題') || k.includes('Demo') || k.includes('專案')) || keys[0];
        const titleName = item[titleKey] || 'Demo 項目';

        let imageUrl = null;
        const imgKey = keys.find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示') || k.includes('image'));
        if (imgKey && item[imgKey]) {
          imageUrl = extractImageUrl(item[imgKey]);
        }

        const descKey = keys.find(k => k.includes('描述') || k.includes('說明') || k.includes('內容') || k.includes('備註'));
        const descText = descKey ? item[descKey] : '';

        const detailsList = [];
        keys.forEach(k => {
          const isImg = imgKey ? (k === imgKey) : false;
          const isDesc = descKey ? (k === descKey) : false;
          const isTitle = (k === titleKey);
          if (!isImg && !isDesc && !isTitle && item[k]) {
            detailsList.push({ key: k, val: item[k] });
          }
        });

        const detailsHtml = detailsList.map(d => `
          <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-100 last:border-0">
            <span class="text-gray-400 font-medium shrink-0 mr-2">${d.key}</span>
            <span class="text-gray-700 font-semibold text-right break-all">${d.val}</span>
          </div>
        `).join('');

        return `
          <article class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all flex flex-col justify-between space-y-4 group">
            <div class="space-y-4">
              ${imageUrl ? `
                <div class="flex justify-center items-center pt-2 pb-1 min-h-[70px]">
                  <img src="${imageUrl}" alt="${titleName}" class="w-2/3 max-h-24 object-contain mx-auto" onerror="this.parentNode.style.display='none'">
                </div>
              ` : ''}
              
              <h3 class="text-base font-bold text-gray-800 text-center group-hover:text-brand-500 transition-colors leading-snug">
                ${titleName}
              </h3>

              ${detailsList.length > 0 ? `
                <div class="bg-gray-50/70 p-3.5 rounded-xl space-y-0.5">
                  ${detailsHtml}
                </div>
              ` : ''}

              ${descText ? `
                <div class="bg-brand-50/60 p-4 rounded-xl border border-brand-100/60 text-center text-xs font-medium text-gray-700 leading-relaxed">
                  ${descText}
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (keyword) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCurrentTab();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderCurrentTab();
    }
  </script>
</body>
</html>
