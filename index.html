<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macnica - 產品目錄與產品線總覽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Color System (RGB 116, 29, 128) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcf5fd',
              100: '#f8eafd',
              200: '#f0d3fa',
              500: '#741D80', // 主色系 RGB(116,29,128)
              600: '#61166c',
              700: '#50105a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .brand-gradient {
      background: linear-gradient(135deg, #741D80 0%, #4A1053 100%);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans relative">

  <!-- 全頁 Loading 遮罩動畫 -->
  <div id="globalLoading" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
      <i data-lucide="database" class="w-6 h-6 text-brand-500 absolute"></i>
    </div>
    <div class="text-center space-y-1">
      <p class="text-base font-bold text-gray-800">資料同步中，請稍候...</p>
      <p class="text-xs text-gray-500">正在從 Google Sheets 取得最新的產品目錄</p>
    </div>
  </div>

  <!-- Header 頂部導覽列 -->
  <header class="brand-gradient text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-row justify-between items-center gap-4">
      
      <!-- 公司 Logo 與換行副標題 -->
      <div class="flex flex-col items-start gap-1">
        <img 
          src="https://www.macnica.com/content/experience-fragments/macnicagwi/apac/galaxy/zh_tw/site/header/master/_jcr_content/root/image.coreimg.svg/1723113588126/macnica-new-logo.svg" 
          alt="Macnica Logo" 
          class="h-6 sm:h-7 object-contain [filter:brightness(0)_invert(1)]"
        >
        <h1 class="text-xs sm:text-sm font-medium tracking-wider text-brand-100 opacity-90">
          產品目錄與產品線總覽
        </h1>
      </div>

      <!-- 右上角統計數據（產品線數量） -->
      <div id="statsBadge" class="flex items-center text-xs bg-white/10 px-3.5 py-1.5 rounded-full backdrop-blur-sm">
        <span>產品線數量: <strong id="productLineCount" class="text-yellow-300 font-bold ml-1 text-sm">0</strong></span>
      </div>

    </div>
  </header>

  <!-- Main Content 主體內容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">

    <!-- 搜尋欄與控制區域 -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:flex-1">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          type="text" 
          id="searchInput"
          placeholder="搜尋產品線、原廠、主要產品或關鍵字..." 
          disabled
          class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm text-sm disabled:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-400"
          oninput="handleSearch()"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
          <i data-lucide="x-circle" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 快速全部展開/收起按鈕 -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button 
          onclick="toggleAllRows(true)" 
          class="px-3 py-2 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-brand-50 hover:text-brand-600 rounded-lg transition-colors flex items-center gap-1"
        >
          <i data-lucide="chevrons-down" class="w-3.5 h-3.5"></i> 全部展開
        </button>
        <button 
          onclick="toggleAllRows(false)" 
          class="px-3 py-2 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-brand-50 hover:text-brand-600 rounded-lg transition-colors flex items-center gap-1"
        >
          <i data-lucide="chevrons-up" class="w-3.5 h-3.5"></i> 全部收起
        </button>
      </div>
    </section>

    <!-- 查無資料提示 -->
    <div id="noDataState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
      <i data-lucide="package-x" class="w-12 h-12 text-gray-300 mx-auto"></i>
      <h3 class="text-lg font-bold text-gray-700">找不到符合條件的產品線</h3>
      <p class="text-sm text-gray-500">請嘗試更換關鍵字重新搜尋</p>
      <button onclick="clearSearch()" class="mt-2 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-600 transition-colors">
        清除搜尋條件
      </button>
    </div>

    <!-- 🌟 產品線條列清單容器 (Bar List) -->
    <section id="productBarList" class="space-y-2.5">
      <!-- 每一列產品線將由 JavaScript 動態生成 -->
    </section>
  </main>

  <!-- Footer 頁尾 -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 space-y-1">
      <p>Macnica 產品線視覺化查詢系統 &copy; Powered by Google Apps Script & GitHub Pages</p>
      <p class="text-gray-400">資料來源：Google Sheets 自動實時同步</p>
    </div>
  </footer>

  <script>
    let rawData = [];
    let headers = [];
    let productLineKey = '';
    let mainProductKey = '';

    window.onload = function() {
      lucide.createIcons();
      fetchSheetData();
    };

    function fetchSheetData() {
      // ⚠️ 務必替換為新 Google Sheet 部署出來的 Web App URL（結尾須為 /exec）
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwfn_bO64Jso9QkpmSRWfXTvEIIh8Q4Ovy0uhqycJRhV1j5Dt-9jJWpjqTvi-lFTB4o/exec";

      // 1. 本地快取秒開機制
      const localCache = localStorage.getItem('macnica_product_line_local');
      if (localCache) {
        try {
          const parsedData = JSON.parse(localCache);
          onDataLoaded(parsedData, true);
        } catch(e) {}
      } else {
        setSearchDisabled(true);
      }

      // 2. 背景同步最新資料
      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error('網路連線失敗');
          return response.json();
        })
        .then(data => {
          if (!data.error) {
            localStorage.setItem('macnica_product_line_local', JSON.stringify(data));
          }
          onDataLoaded(data, false);
        })
        .catch(err => {
          console.error(err);
          if (!localCache) onDataError(err);
        });
    }

    function onDataLoaded(response, isFromCache) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) {
        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }

      if (response.error) {
        if (!isFromCache) alert('資料讀取失敗：' + response.error);
        return;
      }

      headers = response.headers || [];
      rawData = response.rows || [];

      if (!rawData || rawData.length === 0) {
        document.getElementById('noDataState').classList.remove('hidden');
        return;
      }

      detectKeyColumns();
      renderProductBars();
      setSearchDisabled(false);
      updateStats();
    }

    function onDataError(err) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      alert('無法連線至 Google Sheets API，請檢查 Apps Script 發布權限是否設為「所有人」。');
    }

    function setSearchDisabled(disabled) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.disabled = disabled;
    }

    function detectKeyColumns() {
      productLineKey = headers.find(h => h.includes('產品線') || h.includes('類別') || h.toLowerCase().includes('category')) || headers[0];
      mainProductKey = headers.find(h => h.includes('產品') || h.includes('品名') || h.includes('品牌') || h.toLowerCase().includes('product')) || headers[0];
    }

    function extractImageUrl(str) {
      if (!str) return null;
      str = String(str).trim();
      const match = str.match(/https?:\/\/[^\s"',\)]+/i);
      return match ? match[0] : null;
    }

    // 🌟 核心渲染：條列式 Bar + 可展開詳情
    function renderProductBars() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const listContainer = document.getElementById('productBarList');
      const noData = document.getElementById('noDataState');

      const filtered = rawData.filter(item => {
        return !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }

      noData.classList.add('hidden');

      listContainer.innerHTML = filtered.map((item, idx) => {
        const titleName = item[mainProductKey] || item[productLineKey] || '未命名項目';

        // 1. Logo 解析
        let logoUrl = null;
        const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
        if (logoKey && item[logoKey]) {
          logoUrl = extractImageUrl(item[logoKey]);
        }

        // 2. 所在地 / 區域解析
        const locationKey = Object.keys(item).find(k => k.includes('所在地') || k.includes('區域') || k.toLowerCase().includes('location') || k.toLowerCase().includes('region'));
        const locationVal = locationKey ? item[locationKey] : '';

        // 3. 主要產品內容解析
        const mainProductDescKey = Object.keys(item).find(k => k.includes('主要產品') || k.includes('描述') || k.includes('簡介'));
        const mainProductDesc = mainProductDescKey ? item[mainProductDescKey] : '';

        // 4. 其他屬性
        const otherFields = Object.keys(item)
          .filter(k => {
            const isLogo = logoKey ? (k === logoKey) : k.toLowerCase().includes('logo');
            const isMainDesc = mainProductDescKey ? (k === mainProductDescKey) : k.includes('主要產品');
            const isTitle = (k === mainProductKey);
            const isLocation = (k === locationKey);
            return !isLogo && !isMainDesc && !isTitle && !isLocation && item[k];
          })
          .map(k => `
            <span class="inline-flex items-center gap-1 text-xs text-gray-500 bg-gray-50 border border-gray-100 px-2.5 py-1 rounded-md">
              <strong class="text-gray-400 font-normal">${k}:</strong> ${item[k]}
            </span>
          `).join('');

        return `
          <div class="product-bar-item bg-white rounded-xl border border-gray-200/80 shadow-sm hover:border-brand-300 transition-all overflow-hidden" id="bar-item-${idx}">
            
            <!-- 🌟 主 Bar 條目 (點擊即可展開/收起) -->
            <div 
              onclick="toggleRow(${idx})" 
              class="px-4 py-3 sm:px-5 sm:py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 cursor-pointer select-none hover:bg-brand-50/20 transition-colors"
            >
              <!-- 左側：Logo + 產品線名稱 + 所在地標籤 -->
              <div class="flex items-center gap-3 sm:gap-5 flex-1 min-w-0">
                
                <!-- 規範化 Logo 容器 (固定寬高、白底消除) -->
                <div class="w-24 sm:w-28 h-9 sm:h-10 shrink-0 bg-gray-50 border border-gray-100 rounded-lg p-1 flex items-center justify-center">
                  ${logoUrl ? `
                    <img 
                      src="${logoUrl}" 
                      alt="${titleName}" 
                      class="max-h-7 max-w-[90%] object-contain [mix-blend-mode:multiply]"
                      loading="lazy"
                      onerror="this.parentNode.innerHTML='<span class=\\'text-[10px] text-gray-400\\'>Logo</span>'"
                    >
                  ` : `<span class="text-[10px] text-gray-400">無 Logo</span>`}
                </div>

                <!-- 名稱與標籤 -->
                <div class="flex flex-wrap items-center gap-2 min-w-0">
                  <h3 class="text-sm sm:text-base font-bold text-gray-800 tracking-tight truncate">
                    ${titleName}
                  </h3>

                  ${locationVal ? `
                    <span class="inline-flex items-center text-[11px] font-medium text-brand-600 bg-brand-50 border border-brand-100 px-2 py-0.5 rounded-full shrink-0">
                      ${locationVal}
                    </span>
                  ` : ''}
                </div>
              </div>

              <!-- 右側：主要產品預覽提示 + 展開箭頭按鈕 -->
              <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 pt-1 sm:pt-0 border-t sm:border-t-0 border-gray-50">
                <span class="text-xs text-gray-400 flex items-center gap-1 font-medium">
                  <span id="preview-text-${idx}" class="sm:hidden text-gray-500">查看主要產品</span>
                  <span class="hidden sm:inline text-gray-400">主要產品</span>
                </span>
                
                <div id="arrow-container-${idx}" class="w-7 h-7 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-400 group-hover:text-brand-500 transition-transform duration-200">
                  <i data-lucide="chevron-down" id="icon-chevron-${idx}" class="w-4 h-4 transition-transform duration-200"></i>
                </div>
              </div>
            </div>

            <!-- 🌟 抽屜詳情區域（預設收起 hidden） -->
            <div id="detail-${idx}" class="hidden border-t border-gray-100 bg-gray-50/50 px-4 py-4 sm:px-6 sm:py-4 transition-all space-y-3">
              
              <!-- 主要產品內容 (高質感置中/左對齊區塊) -->
              ${mainProductDesc ? `
                <div class="space-y-1.5">
                  <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="layers" class="w-3.5 h-3.5 text-brand-500"></i> 主要產品內容
                  </div>
                  <div class="bg-white p-3.5 rounded-xl border border-brand-100/70 text-xs sm:text-sm text-gray-700 leading-relaxed">
                    ${mainProductDesc}
                  </div>
                </div>
              ` : '<p class="text-xs text-gray-400 italic">無主要產品內容</p>'}

              <!-- 額外屬性資訊 (若有) -->
              ${otherFields ? `
                <div class="flex flex-wrap gap-2 pt-1 border-t border-gray-100">
                  ${otherFields}
                </div>
              ` : ''}

            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 單列展開 / 收起切換
    function toggleRow(idx) {
      const detail = document.getElementById(`detail-${idx}`);
      const chevron = document.getElementById(`icon-chevron-${idx}`);
      if (!detail) return;

      const isCollapsed = detail.classList.contains('hidden');

      if (isCollapsed) {
        detail.classList.remove('hidden');
        chevron.classList.add('rotate-180', 'text-brand-500');
      } else {
        detail.classList.add('hidden');
        chevron.classList.remove('rotate-180', 'text-brand-500');
      }
    }

    // 全部展開 / 全部收起
    function toggleAllRows(expand) {
      const items = document.querySelectorAll('[id^="detail-"]');
      const chevrons = document.querySelectorAll('[id^="icon-chevron-"]');

      items.forEach((item, i) => {
        if (expand) {
          item.classList.remove('hidden');
          if (chevrons[i]) chevrons[i].classList.add('rotate-180', 'text-brand-500');
        } else {
          item.classList.add('hidden');
          if (chevrons[i]) chevrons[i].classList.remove('rotate-180', 'text-brand-500');
        }
      });
    }

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (keyword) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderProductBars();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderProductBars();
    }

    function updateStats() {
      const categories = new Set(rawData.map(item => item[productLineKey]).filter(Boolean));
      document.getElementById('productLineCount').innerText = categories.size;
    }
  </script>
</body>
</html>
