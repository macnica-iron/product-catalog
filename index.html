<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>產品目錄與產品線總覽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Color System (RGB 116, 29, 128) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fcf5fd',
              100: '#f8eafd',
              200: '#f0d3fa',
              500: '#741D80', // 主色系 RGB(116,29,128)
              600: '#61166c',
              700: '#50105a',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .brand-gradient {
      background: linear-gradient(135deg, #741D80 0%, #4A1053 100%);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans relative">

  <!-- 全頁 Loading 遮罩動畫 -->
  <div id="globalLoading" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex flex-col items-center justify-center space-y-4 transition-opacity duration-300">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
      <i data-lucide="database" class="w-6 h-6 text-brand-500 absolute"></i>
    </div>
    <div class="text-center space-y-1">
      <p class="text-base font-bold text-gray-800">資料同步中，請稍候...</p>
      <p class="text-xs text-gray-500">正在從 Google Sheets 取得最新的產品目錄</p>
    </div>
  </div>

  <!-- Header 頂部導覽列 -->
  <header class="brand-gradient text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white/10 rounded-lg backdrop-blur-sm">
          <i data-lucide="layers" class="w-7 h-7 text-white"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">產品目錄與產品線總覽</h1>
          <p class="text-xs text-brand-100 opacity-90">Google Sheets 動態即時同步網站</p>
        </div>
      </div>
      <!-- 統計數據 -->
      <div id="statsBadge" class="hidden sm:flex items-center gap-4 text-xs bg-white/10 px-4 py-2 rounded-full backdrop-blur-sm">
        <span>產品線: <strong id="productLineCount" class="text-yellow-300 font-bold">0</strong></span>
        <span class="border-r border-white/20 h-3"></span>
        <span>總產品數: <strong id="totalProductCount" class="text-yellow-300 font-bold">0</strong></span>
      </div>
    </div>
  </header>

  <!-- Main Content 主體內容 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- 搜尋欄區域 (已拿掉紅框標籤區域) -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input 
          type="text" 
          id="searchInput"
          placeholder="搜尋主要產品名稱、規格或關鍵字..." 
          disabled
          class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm disabled:bg-gray-100 disabled:cursor-not-allowed disabled:text-gray-400"
          oninput="handleSearch()"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
          <i data-lucide="x-circle" class="w-5 h-5"></i>
        </button>
      </div>
    </section>

    <!-- 查無資料提示 -->
    <div id="noDataState" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm space-y-3">
      <i data-lucide="package-x" class="w-12 h-12 text-gray-300 mx-auto"></i>
      <h3 class="text-lg font-bold text-gray-700">找不到符合條件的產品</h3>
      <p class="text-sm text-gray-500">請嘗試更換關鍵字重新搜尋</p>
      <button onclick="clearSearch()" class="mt-2 inline-flex items-center gap-2 bg-brand-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-600 transition-colors">
        清除搜尋條件
      </button>
    </div>

    <!-- 產品列表卡片網格 (RWD: 手機 1 欄 / 平板 2 欄 / 桌機 3 欄) -->
    <section id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 產品卡片將由 JavaScript 動態渲染 -->
    </section>
  </main>

  <!-- Footer 頁尾 -->
  <footer class="bg-white border-t border-gray-200 mt-auto py-6">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 space-y-1">
      <p>產品線視覺化查詢系統 &copy; Powered by Google Apps Script & GitHub Pages</p>
      <p class="text-gray-400">資料來源：Google Sheets 自動實時同步</p>
    </div>
  </footer>

  <script>
    let rawData = [];
    let headers = [];
    let productLineKey = '';
    let mainProductKey = '';

    window.onload = function() {
      lucide.createIcons();
      fetchSheetData();
    };

    function fetchSheetData() {
      // ⚠️ 務必替換為你真實的 Apps Script Web App 網址（結尾須為 /exec）
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxZj0MaQKmVItG0rtXQBtQeGjp8JmQ7_Vs8sBvNAfm36ra2i8ikcXoXMBA4xgrnpAQpEQ/exec";

      setSearchDisabled(true);

      fetch(GAS_API_URL)
        .then(response => {
          if (!response.ok) throw new Error('網路連線失敗');
          return response.json();
        })
        .then(data => onDataLoaded(data))
        .catch(err => {
          console.error(err);
          onDataError(err);
        });
    }

    function onDataLoaded(response) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) {
        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }

      if (response.error) {
        alert('資料讀取失敗：' + response.error);
        return;
      }

      headers = response.headers || [];
      rawData = response.rows || [];

      if (!rawData || rawData.length === 0) {
        document.getElementById('noDataState').classList.remove('hidden');
        return;
      }

      detectKeyColumns();
      renderProducts();
      setSearchDisabled(false);
      updateStats();
    }

    function onDataError(err) {
      const loadingOverlay = document.getElementById('globalLoading');
      if (loadingOverlay) loadingOverlay.classList.add('hidden');
      alert('無法連線至 Google Sheets API，請檢查 Apps Script 發布權限是否設為「所有人」。');
    }

    function setSearchDisabled(disabled) {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.disabled = disabled;
    }

    function detectKeyColumns() {
      productLineKey = headers.find(h => h.includes('產品線') || h.includes('類別') || h.toLowerCase().includes('category')) || headers[0];
      mainProductKey = headers.find(h => h.includes('產品') || h.includes('品名') || h.toLowerCase().includes('product')) || headers[1] || headers[0];
    }

    // 從字串中提取圖片 URL
    function extractImageUrl(str) {
      if (!str) return null;
      str = String(str).trim();
      const match = str.match(/https?:\/\/[^\s"',\)]+/i);
      return match ? match[0] : null;
    }

    function renderProducts() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('productGrid');
      const noData = document.getElementById('noDataState');

      const filtered = rawData.filter(item => {
        return !keyword || Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noData.classList.remove('hidden');
        return;
      }

      noData.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const categoryName = item[productLineKey] || '未分類';
        const productName = item[mainProductKey] || '未命名產品';

        // 嘗試找出 Logo URL
        let logoUrl = null;
        const logoKey = Object.keys(item).find(k => k.toLowerCase().includes('logo') || k.includes('圖片') || k.includes('圖示'));
        if (logoKey && item[logoKey]) {
          logoUrl = extractImageUrl(item[logoKey]);
        }

        const otherDetails = Object.keys(item)
          .filter(k => k !== productLineKey && k !== mainProductKey && item[k])
          .map(k => {
            const rawVal = item[k];
            const imgUrl = extractImageUrl(rawVal);
            
            let displayValue = rawVal;
            // 若為 Logo 欄位或內含圖片 URL 則繪製 <img> 標籤
            if (imgUrl || k.toLowerCase().includes('logo')) {
              if (imgUrl) {
                displayValue = `<img src="${imgUrl}" alt="${k}" class="max-h-8 max-w-[140px] object-contain ml-auto rounded" onerror="this.onerror=null; this.parentNode.innerText='無 Logo';">`;
              } else {
                displayValue = `<span class="text-gray-400">無圖片</span>`;
              }
            }

            return `
              <div class="flex justify-between items-center text-xs py-1.5 border-b border-gray-100 last:border-0 min-h-[32px]">
                <span class="text-gray-400 font-medium shrink-0 mr-2">${k}</span>
                <span class="text-gray-700 font-semibold text-right break-all">${displayValue}</span>
              </div>
            `;
          }).join('');

        return `
          <article class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all flex flex-col justify-between space-y-4 group">
            <div class="space-y-3">
              <!-- 上方 Category Badge 與 Logo -->
              <div class="flex justify-between items-start gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-brand-50 text-brand-500 border border-brand-100">
                  ${categoryName}
                </span>
                ${logoUrl ? `<img src="${logoUrl}" alt="Logo" class="max-h-8 max-w-[100px] object-contain" onerror="this.style.display='none'">` : ''}
              </div>

              <!-- 主要產品標題 -->
              <h3 class="text-lg font-bold text-gray-800 group-hover:text-brand-500 transition-colors leading-snug">
                ${productName}
              </h3>

              <!-- 規格/詳細資訊列表 -->
              <div class="bg-gray-50/70 p-3 rounded-xl space-y-0.5">
                ${otherDetails || '<p class="text-xs text-gray-400">無其他詳細規格</p>'}
              </div>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function handleSearch() {
      const keyword = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (keyword) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderProducts();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderProducts();
    }

    function updateStats() {
      const categories = new Set(rawData.map(item => item[productLineKey]).filter(Boolean));
      document.getElementById('productLineCount').innerText = categories.size;
      document.getElementById('totalProductCount').innerText = rawData.length;
    }
  </script>
</body>
</html>
